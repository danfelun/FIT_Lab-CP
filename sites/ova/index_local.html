cumenta tácticas y técnicas empleadas por adversarios reales. Se usa como referencia para crear modelos de amenaza y metodologías en distintos sectores. Al ser abierta y gratuita, permite que organizaciones y profesionales fortalezcan sus estrategias de ciberseguridad de manera colaborativa y basada en evidencia.\n\nRelación directa con el pensamiento adversaríal\n\nMITRE ATT-CK se alinea directamente con el pensamiento adversaríal porque estructura y organiza la forma en que los atacantes actúan en el mundo real, permitiendo que los defensores comprendan, anticipen y emulen sus comportamientos de manera estratégica. Al usar este marco, el profesional adopta la perspectiva del adversario, analiza su lógica operativa y diseña defensas más efectivas basadas en patrones reales de ataque.\n\nSección dos:\nSTRIDE\n\nMicrosoft utiliza STRIDE para clasificar tipos de amenazas y facilitar la identificación temprana de riesgos en el ciclo de desarrollo seguro. El modelo contempla seis categorías: Suplantación, Alteración, Rechazo, Divulgación de información, Denegación de servicio y Elevación de privilegios, permitiendo estructurar el análisis y orientar la mitigación de vulnerabilidades.\n\nRelación con el pensamiento adversaríal\n\nSTRIDE impulsa que el analista adopte la perspectiva del atacante al cuestionarse cómo podría manipular, acceder o interrumpir servicios, fortaleciendo así la anticipación y el razonamiento adversaríal.\n\nComo complemento, existe el modelo DREAD que permite priorizar cada amenaza evaluando su potencial de daño, reproducibilidad, facilidad de explotación, usuarios afectados y nivel de descubrimiento. Al combinar STRIDE y DREAD, el analista clasifica las amenazas y determina su severidad, mejorando la toma de decisiones desde un enfoque adversaríal.","rType":"text"}},"status":"finished","generated":{"text":{"val":"4.2 Modelos y enfoques para razonar como un adversario\n\nMITRE ATT-CK\nBase de conocimiento global que documenta tácticas y técnicas
